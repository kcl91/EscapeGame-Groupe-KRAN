<!DOCTYPE html>
<html>

<head>
  <title>Projet Escape Game</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/bootstrap/dist/css/bootstrap.min.css">

  <!-- JQuery téléchargement -->
  <script src="https://unpkg.com/jquery/dist/jquery.min.js"></script>
  <script src="https://unpkg.com/jquery-ui/dist/jquery-ui.min.js"></script>

  <!-- adapter le thème choisir :  -->
  <link rel="stylesheet" href="https://unpkg.com/jquery-ui/dist/themes/dark-hive/jquery-ui.min.css">

  <!-- ajouter balise de style -->
  <link rel="stylesheet" href="style.css">

  <link rel="preload" href="son1.mp3" as="audio" type="audio/mpeg" fetchpriority="high">
  <link rel="preload" href="fond1.jpg" as="image" type="image/jpeg" fetchpriority="high">

</head>

<body>

  <p><button id="idStop">Stop</button></p>

  <script>
    $(document).ready(
      function () {

       let jsWidth = 500


        // écrire le JQuery ici
        console.log('*** JQuery ' + $.fn.jquery + ' prêt ***')
        // Fstop
        var Fstop = function () {
          $('#idFX').remove()
        } //fin Fstop
        $('#idStop').on('click', Fstop)

        // Fplay
        var Fplay = function (Pfile) {
          let oAudio = $('<audio autoplay id="idFX"> <source src="' + Pfile + '"></audio>')
          $('body').append(oAudio)


if ($("#idBTzik").length == 0) {
$("body").prepend('<button id="idBTzik">Pause</button>');
}
$("#idBTzik").text("Pause").show();
$("#idBTzik").off("click").on("click", FpauseZIK);
};

let FpauseZIK = function () {
let audio = document.getElementById("idZIK");
if (audio) {
audio.pause();
}
$("#idBTzik").text("Continue");
$("#idBTzik").off("click").on("click", FcontinueZIK);
};

let FcontinueZIK = function () {
let audio = document.getElementById("idZIK");
if (audio) {
audio.play();
}
$("#idBTzik").text("Pause");
$("#idBTzik").off("click").on("click", FpauseZIK);
};

let FstopZIK = function () {
$("#idZIK").remove();
$("#idBTzik").hide();
















        } //fin Fplay

        
        // Fscene2

        let Fscene2 = function () { // Début Fscene2
          // Stopper précedents sons
          Fstop()
          // Jouer son splash.mp3
          Fplay('wind.mp3')

          let shtml = '<div>'
          shtml += 'Chaque barreau d\'aluminium grince sous votre poids au-dessus du vide, mais les échelles tiennent. Vous atteignez l\'autre bord, les mains engourdies par l\'adrénaline.La pente plonge désormais à la verticale. Vous installez votre corde pour descendre en rappel le long d\'une paroi vertigineuse. À mi-course, le couloir se divise : d\'un côté, un manteau de neige poudreuse épaisse ; de l\'autre, une saillie de rochers noirs exposés au vent.La nuit commence à étirer ses ombres sur la paroi.'
          shtml += '<hr/>'
          shtml += '<center><img src="image2.jpg"></center>'
          shtml += '</div>'

          oBouton = {
            // Bouton recommence
            'Recommencer': function () { $(this).on('dialogclose', Fscene1).dialog('close').dialog('destroy').remove() },
            'Fin': function () { $(this).dialog('close').dialog('destroy').remove() }
          }

          oOption = {
            buttons: oBouton,
            title: 'Action !',
            width : jsWidth,
            show: { effect: 'blind' }
          }

          $(shtml).dialog(oOption)
        } // fin Fscene2



























        // Fin de la Fscene2

        // Debut de Fscene1 
        let Fscene1 = function () { // début Fscene1
          // Stopper le son 
          Fstop()

          var shtml = '<div>'
          shtml += 'Fraîchement arrivé au sommet du K2 (8 611 m), nos alpinistes savourent brièvement leur victoire avant d\'être rattrapé par le froid extrême, le manque d\'oxygène et le danger mortel de la descente. Nos 4 amis n\'arrive pas à se décider s\'ils doivent descendre immédiatement pour esquiver la tempête ou continuer à admirer le paysage.</>'
          shtml += '<hr/>'
          shtml += '<center><img src="image1.jpg"></center>'
          shtml += '</div>'

          oBouton = {
            'Commencer à descendre': function () { $(this).on('dialogclose', Fscene2).dialog('close').dialog('destroy').remove() },
            'Continuer à admirer le paysage': function () { $(this).dialog('close').dialog('destroy').remove() }
          }

          oOption = {
            width : jsWidth,
            buttons: oBouton,
            title: 'Death Mountain',
            show: { effect: 'blind' }
          }

          $(shtml).dialog(oOption)
        }// fin Fscene1 

        // Debut de Fscene3.
        let Fscene3 = function () { // début Fscene3
          // Stopper le son 
          Fstop()

          var shtml = '<div>'
          shtml += 'La neige poudreuse amortit chacun de vos pas et retient votre progression. Vous touchez enfin le fond du couloir, mais le froid vient de franchir un seuil critique.Vos doigts n\'ont plus aucune sensibilité. Vos lèvres gercent et saignent. À quelques mètres sur votre flanc, une cavite sombre s\'enfonce dans la paroi rocheuse : une grotte naturelle, à l\'abri du vent.L\'endroit est lugubre, presque oppressant, mais rester dehors vous vide de votre chaleur vitale à chaque seconde.'
          shtml += '<hr/>'
          shtml += '<center><img src="image3.jpg"></center>'
          shtml += '</div>'

          oBouton = {
            'Continuer et passé le pont': function () { $(this).on('dialogclose', Fscene2).dialog('close').dialog('destroy').remove() },
            'S\'arreter': function () { $(this).dialog('close').dialog('destroy').remove() }
          }
        
          oOption = {
            width : jsWidth,
            buttons: oBouton,
            title: 'Death Mountain',
            show: { effect: 'blind' }
          }

          $(shtml).dialog(oOption)
        }// fin Fscene3

        Fscene1()
        // Invoquer Fscene1 pour démarrer le jeu


        // Invoquer Fscene1 pour démarrer le jeu


      })// fin du JQuery

  </script>
</body>

</html>
