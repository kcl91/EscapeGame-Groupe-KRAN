<!DOCTYPE html>
<html>

<head>
  <title>Projet Escape Game</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/bootstrap/dist/css/bootstrap.min.css">

  <!-- JQuery téléchargement -->
  <script src="https://unpkg.com/jquery/dist/jquery.min.js"></script>
  <script src="https://unpkg.com/jquery-ui/dist/jquery-ui.min.js"></script>

  <!-- adapter le thème choisir :  -->
  <link rel="stylesheet" href="https://unpkg.com/jquery-ui/dist/themes/dark-hive/jquery-ui.min.css">

  <!-- ajouter balise de style -->
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="zikFond.mp3" as="audio" type="audio/mpeg" fetchpriority="high">
   <link rel="preload" href="fond1.jpg" as="image" type="image/jpeg" fetchpriority="high">

</head>

<body>

  <p><button id="idStop">Stop</button></p>

  <script>
    $(document).ready(
      function () {
        // écrire le JQuery ici
        console.log('*** JQuery ' + $.fn.jquery + ' prêt ***')
        
        // Début fonction Fstop 
        // Fstop
        var Fstop = function () {
          $('audio').remove()
        } //fin Fstop
        $('#idStop').on('click', Fstop)

        // Début fonction Fplay
        // Fplay
        var Fplay = function (Pfile) {
          var oAudio = $('<audio autoplay> <source src="' + Pfile + '"></audio>')
          $('body').append(oAudio)
        } //fin Fplay


        // Fscene2

        let Fscene2 = function () { // Début Fscene2
          // Stopper précedents sons
          Fstop()
          // Jouer son splash.mp3
          Fplay('wind.mp3')
          
          let shtml = '<div>'
          shtml += '<h3>Début de mon ascension !!<h3>'
          shtml += '<hr/>'
          shtml += '<center><img src="chemin.jpg"></center>'
          shtml += '</div>'

          oBouton = {
            // Bouton recommence
            'Recommencer': function () { $(this).on('dialogclose', Fscene1).dialog('close').dialog('destroy').remove() },
            'Fin': function () { $(this).dialog('close').dialog('destroy').remove() }
          }

          oOption = {
            buttons: oBouton,
            title: 'Action !',
            show: { effect: 'blind' }
          }

          $(shtml).dialog(oOption)
        } // fin Fscene2



























        // Fin de la Fscene2

        // Debut de Fscene1 
        let Fscene1 = function () { // début Fscene1
          // Stopper le son 
          Fstop()

          var shtml = '<div>'
          shtml += '<h3>Enfin arrivé au sommet. Maintenant je dois redescendre sans trainez ! </h3>'
          shtml += '<hr/>'
          shtml += '<center><img src="image1.jpg"></center>'
          shtml += '</div>'

          oBouton = {
            'Départ': function () { $(this).on('dialogclose', Fscene2).dialog('close').dialog('destroy').remove() },
            'Fin': function () { $(this).dialog('close').dialog('destroy').remove() }
          }

          oOption = {
            buttons: oBouton,
            title: 'Death Mountain',
            show: { effect: 'blind' }
          }

          $(shtml).dialog(oOption)
        }// fin Fscene1


        Fscene1()
        // Invoquer Fscene1 pour démarrer le jeu


        // Invoquer Fscene1 pour démarrer le jeu


      })// fin du JQuery

  </script>
</body>

</html>
